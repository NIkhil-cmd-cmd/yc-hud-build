<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShaderGradient</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090909;
      }

      #root {
        position: absolute;
        inset: 0;
      }

      #root canvas {
        width: 100% !important;
        height: 100% !important;
      }

      .shader-bg-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse 85% 75% at 50% 35%,
          transparent 25%,
          rgba(9, 9, 9, 0.75) 100%
        );
        z-index: 1;
      }
    </style>
