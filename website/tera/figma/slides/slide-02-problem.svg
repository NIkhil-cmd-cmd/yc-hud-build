<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#090909"/>

  <text x="100" y="100" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#C4A484" letter-spacing="0.14em" font-weight="600">PROBLEM</text>
  <text x="100" y="200" font-family="Georgia,'Instrument Serif',serif" font-size="68" fill="#F5F2EC" letter-spacing="-0.02em">
    <tspan x="100" dy="0">Every repeat run pays</tspan>
    <tspan x="100" dy="78">the full LLM bill.</tspan>
  </text>

  <rect x="100" y="340" width="1720" height="560" rx="28" fill="#111110" stroke="#ffffff" stroke-opacity="0.07"/>

  <rect x="148" y="400" width="760" height="460" rx="20" fill="#141414" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="180" y="450" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#7A7A74" letter-spacing="0.12em" font-weight="600">AGENT LOOP</text>

  <rect x="180" y="500" width="160" height="100" rx="14" fill="#1a1a18" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="260" y="545" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#F5F2EC" font-weight="600">Observe</text>
  <text x="260" y="572" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#7A7A74">page state</text>

  <path d="M350 550h50" stroke="#C4A484" stroke-width="2" stroke-opacity="0.4"/>
  <polygon points="400,545 400,555 410,550" fill="#C4A484" fill-opacity="0.4"/>

  <rect x="420" y="480" width="180" height="140" rx="14" fill="#1c1612" stroke="#C4A484" stroke-opacity="0.4"/>
  <text x="510" y="535" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#C4A484" font-weight="600">LLM</text>
  <text x="510" y="575" text-anchor="middle" font-family="Georgia,serif" font-size="40" fill="#F5F2EC">15k</text>
  <text x="510" y="600" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="12" fill="#A3A39D">tokens</text>

  <path d="M610 550h50" stroke="#C4A484" stroke-width="2" stroke-opacity="0.4"/>
  <polygon points="660,545 660,555 670,550" fill="#C4A484" fill-opacity="0.4"/>

  <rect x="680" y="500" width="160" height="100" rx="14" fill="#1a1a18" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="760" y="545" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#F5F2EC" font-weight="600">Act</text>
  <text x="760" y="572" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#7A7A74">repeat</text>

  <path d="M760 610v40" stroke="#7A7A74" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M760 650h-520" stroke="#7A7A74" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M240 650v-50" stroke="#7A7A74" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="480" y="690" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="15" fill="#7A7A74">Same cost every lap</text>

  <rect x="980" y="400" width="788" height="460" rx="20" fill="#141414" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="1012" y="450" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#7A7A74" letter-spacing="0.12em" font-weight="600">BROWSER USE BASELINE</text>

  <text x="1012" y="540" font-family="Georgia,serif" font-size="80" fill="#A3A39D" letter-spacing="-0.03em">68s</text>
  <text x="1180" y="540" font-family="Georgia,serif" font-size="80" fill="#C4A484" letter-spacing="-0.03em">15k</text>
  <text x="1012" y="590" font-family="'DM Sans',system-ui,sans-serif" font-size="22" fill="#A3A39D">per run, every run</text>

  <line x1="1012" y1="640" x2="1740" y2="640" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="1012" y="700" font-family="'DM Sans',system-ui,sans-serif" font-size="20" fill="#F5F2EC">Run 1</text>
  <text x="1200" y="700" font-family="'DM Sans',system-ui,sans-serif" font-size="20" fill="#A3A39D">15k tokens</text>
  <text x="1012" y="750" font-family="'DM Sans',system-ui,sans-serif" font-size="20" fill="#F5F2EC">Run 2</text>
  <text x="1200" y="750" font-family="'DM Sans',system-ui,sans-serif" font-size="20" fill="#A3A39D">15k tokens</text>
  <text x="1012" y="800" font-family="'DM Sans',system-ui,sans-serif" font-size="20" fill="#F5F2EC">Run 3</text>
  <text x="1200" y="800" font-family="'DM Sans',system-ui,sans-serif" font-size="20" fill="#A3A39D">15k tokens</text>

  <text x="1820" y="1000" text-anchor="end" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#5C6B5A">02 / 08</text>
  <line x1="100" y1="1020" x2="1820" y2="1020" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
