<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#090909"/>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#C4A484"/><stop offset="1" stop-color="#8B6914" stop-opacity="0.4"/></linearGradient>
  </defs>

  <text x="100" y="100" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#C4A484" letter-spacing="0.14em" font-weight="600">THE PROBLEM</text>
  <text x="100" y="200" font-family="Georgia,'Instrument Serif',serif" font-size="68" fill="#F5F2EC" letter-spacing="-0.02em">
    <tspan x="100" dy="0">External agents pay the full</tspan>
    <tspan x="100" dy="78">LLM bill on every repeat run.</tspan>
  </text>
  <text x="100" y="400" font-family="'DM Sans',system-ui,sans-serif" font-size="24" fill="#A3A39D">Browser Use and similar stacks re-reason from scratch — ~15k tokens, ~68s, every time.</text>

  <!-- Token burn loop diagram -->
  <rect x="100" y="480" width="1720" height="380" rx="28" fill="#111110" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="148" y="540" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#7A7A74" letter-spacing="0.12em" font-weight="600">TYPICAL AGENT LOOP</text>

  <!-- Loop nodes -->
  <rect x="180" y="620" width="200" height="120" rx="16" fill="#1a1a18" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="280" y="675" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="18" fill="#F5F2EC" font-weight="600">Observe page</text>
  <text x="280" y="705" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="14" fill="#7A7A74">Playwright / Chrome</text>

  <path d="M390 680h80" stroke="#C4A484" stroke-width="2" stroke-opacity="0.5"/>
  <polygon points="470,675 470,685 482,680" fill="#C4A484" fill-opacity="0.5"/>

  <rect x="490" y="600" width="220" height="160" rx="16" fill="#241810" stroke="#C4A484" stroke-opacity="0.45"/>
  <text x="600" y="665" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="18" fill="#C4A484" font-weight="600">LLM decides</text>
  <text x="600" y="700" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#F5F2EC">~15k</text>
  <text x="600" y="730" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#A3A39D">tokens / run</text>

  <path d="M720 680h80" stroke="#C4A484" stroke-width="2" stroke-opacity="0.5"/>
  <polygon points="800,675 800,685 812,680" fill="#C4A484" fill-opacity="0.5"/>

  <rect x="820" y="620" width="200" height="120" rx="16" fill="#1a1a18" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="920" y="675" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="18" fill="#F5F2EC" font-weight="600">Execute action</text>
  <text x="920" y="705" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="14" fill="#7A7A74">New DOM state</text>

  <path d="M1020 680h60" stroke="#7A7A74" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="1100" y="675" font-family="'DM Sans',system-ui,sans-serif" font-size="28" fill="#7A7A74">?</text>
  <text x="1140" y="685" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#7A7A74">Repeat until done</text>

  <!-- Stacked cost bars -->
  <text x="1380" y="540" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#7A7A74" letter-spacing="0.12em" font-weight="600">COST COMPOUNDS</text>
  <rect x="1380" y="580" width="360" height="36" rx="8" fill="#C4A484" fill-opacity="0.85"/><text x="1400" y="604" font-family="'DM Sans',system-ui,sans-serif" font-size="14" fill="#090909" font-weight="600">Run 1 · ~15k tokens</text>
  <rect x="1380" y="630" width="360" height="36" rx="8" fill="#C4A484" fill-opacity="0.65"/><text x="1400" y="654" font-family="'DM Sans',system-ui,sans-serif" font-size="14" fill="#090909" font-weight="600">Run 2 · ~15k tokens</text>
  <rect x="1380" y="680" width="360" height="36" rx="8" fill="#C4A484" fill-opacity="0.45"/><text x="1400" y="704" font-family="'DM Sans',system-ui,sans-serif" font-size="14" fill="#F5F2EC" font-weight="600">Run 3 · ~15k tokens</text>
  <text x="1380" y="770" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#A3A39D">Same workflow. Same cost. Every time.</text>

  <text x="1820" y="1000" text-anchor="end" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#5C6B5A">02 / 08</text>
  <line x1="100" y1="1020" x2="1820" y2="1020" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
