  <path d="M564 560h120" stroke="#C4A484" stroke-width="2" stroke-opacity="0.5"/><polygon points="684,555 684,565 696,560" fill="#C4A484" fill-opacity="0.5"/>
  <circle cx="760" cy="560" r="44" fill="#1a1a18" stroke="#C4A484" stroke-width="2"/>
  <text x="760" y="555" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#A3A39D">select</text>
  <text x="760" y="572" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#F5F2EC">SÇ</text>
  <path d="M804 560h120" stroke="#12A884" stroke-width="2"/><polygon points="924,555 924,565 936,560" fill="#12A884"/>
  <circle cx="1000" cy="560" r="44" fill="#0c1814" stroke="#12A884" stroke-width="2"/>
  <text x="1000" y="568" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="14" fill="#12A884">SÉ</text>

