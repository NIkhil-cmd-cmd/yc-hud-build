  <rect width="1920" height="1080" fill="url(#g)"/>

  <text x="100" y="100" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#C4A484" letter-spacing="0.14em" font-weight="600">STEP 2 ∑ COMPILE</text>
  <text x="100" y="200" font-family="Georgia,'Instrument Serif',serif" font-size="68" fill="#F5F2EC" letter-spacing="-0.02em">Actions become a policy graph.</text>
  <text x="100" y="290" font-family="'DM Sans',system-ui,sans-serif" font-size="24" fill="#A3A39D">Say "save this as book cheapest flight"  the Python engine compiles an embedding-based MDP on your Mac in seconds.</text>

