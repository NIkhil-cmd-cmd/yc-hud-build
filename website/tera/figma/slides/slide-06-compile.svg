<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#090909"/>

  <text x="100" y="100" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#C4A484" letter-spacing="0.14em" font-weight="600">COMPILE</text>
  <text x="100" y="200" font-family="Georgia,'Instrument Serif',serif" font-size="68" fill="#F5F2EC" letter-spacing="-0.02em">Turn actions into a policy graph.</text>
  <text x="100" y="280" font-family="'DM Sans',system-ui,sans-serif" font-size="24" fill="#A3A39D">"Save this workflow" compiles an embedding MDP on your Mac.</text>

  <rect x="100" y="340" width="1100" height="560" rx="28" fill="#141414" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="148" y="400" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#7A7A74" letter-spacing="0.12em" font-weight="600">WORKFLOW GRAPH</text>

  <circle cx="240" cy="540" r="48" fill="#1a1a18" stroke="#C4A484" stroke-width="2"/>
  <text x="240" y="548" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#F5F2EC">S0</text>
  <path d="M288 540h100" stroke="#C4A484" stroke-width="2" stroke-opacity="0.45"/><polygon points="388,535 388,545 398,540" fill="#C4A484" fill-opacity="0.45"/>
  <circle cx="460" cy="540" r="48" fill="#1a1a18" stroke="#C4A484" stroke-width="2"/>
  <text x="460" y="535" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#A3A39D">search</text>
  <text x="460" y="552" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="14" fill="#F5F2EC">S1</text>
  <path d="M508 540h100" stroke="#C4A484" stroke-width="2" stroke-opacity="0.45"/><polygon points="608,535 608,545 618,540" fill="#C4A484" fill-opacity="0.45"/>
  <circle cx="680" cy="540" r="48" fill="#1a1a18" stroke="#C4A484" stroke-width="2"/>
  <text x="680" y="535" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#A3A39D">select</text>
  <text x="680" y="552" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="14" fill="#F5F2EC">S2</text>
  <path d="M728 540h100" stroke="#12A884" stroke-width="2"/><polygon points="828,535 828,545 838,540" fill="#12A884"/>
  <circle cx="900" cy="540" r="48" fill="#0c1814" stroke="#12A884" stroke-width="2"/>
  <text x="900" y="548" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#12A884">S3</text>

  <text x="148" y="660" font-family="'DM Sans',system-ui,sans-serif" font-size="18" fill="#7A7A74">At replay: match current page embedding to nearest state, execute stored action.</text>

  <rect x="1240" y="340" width="580" height="560" rx="28" fill="#111110" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="1288" y="400" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#7A7A74" letter-spacing="0.12em" font-weight="600">ON DISK</text>
  <rect x="1288" y="440" width="484" height="52" rx="10" fill="#1a1a18"/>
  <text x="1310" y="472" font-family="ui-monospace,monospace" font-size="13" fill="#A3A39D">~/Library/Application Support/OpenHive/</text>
  <text x="1288" y="540" font-family="'DM Sans',system-ui,sans-serif" font-size="20" fill="#F5F2EC">State embeddings</text>
  <text x="1288" y="600" font-family="'DM Sans',system-ui,sans-serif" font-size="20" fill="#F5F2EC">Action + DOM ref per step</text>
  <text x="1288" y="660" font-family="'DM Sans',system-ui,sans-serif" font-size="20" fill="#F5F2EC">Transition graph</text>
  <rect x="1288" y="720" width="484" height="120" rx="16" fill="#0c1814" stroke="#12A884" stroke-opacity="0.25"/>
  <text x="1316" y="780" font-family="Georgia,serif" font-size="26" fill="#12A884">All local.</text>
  <text x="1316" y="818" font-family="'DM Sans',system-ui,sans-serif" font-size="17" fill="#A3A39D">Nothing leaves your machine.</text>

  <text x="1820" y="1000" text-anchor="end" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#5C6B5A">06 / 08</text>
  <line x1="100" y1="1020" x2="1820" y2="1020" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
