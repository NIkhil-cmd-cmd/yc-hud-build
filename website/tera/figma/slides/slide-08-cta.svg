<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#090909"/>

  <text x="100" y="100" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#C4A484" letter-spacing="0.14em" font-weight="600">DEMO</text>
  <text x="100" y="200" font-family="Georgia,'Instrument Serif',serif" font-size="72" fill="#F5F2EC" letter-spacing="-0.02em">Two and a half minutes.</text>

  <rect x="100" y="320" width="1720" height="320" rx="28" fill="#141414" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="148" y="380" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#7A7A74" letter-spacing="0.12em" font-weight="600">SCRIPT</text>

  <text x="148" y="450" font-family="'DM Sans',system-ui,sans-serif" font-size="24" fill="#F5F2EC">1. Browse the task manually</text>
  <text x="148" y="510" font-family="'DM Sans',system-ui,sans-serif" font-size="24" fill="#F5F2EC">2. Save as a named workflow</text>
  <text x="148" y="570" font-family="'DM Sans',system-ui,sans-serif" font-size="24" fill="#F5F2EC">3. Run it again in a new tab</text>
  <text x="900" y="450" font-family="'DM Sans',system-ui,sans-serif" font-size="24" fill="#12A884">4. Watch: 0 tokens, ~15s</text>

  <rect x="100" y="700" width="820" height="72" rx="36" fill="#F5F2EC"/>
  <text x="510" y="744" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="19" fill="#090909" font-weight="600">tera-zeta-ten.vercel.app</text>

  <rect x="1000" y="700" width="820" height="72" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="1410" y="744" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="17" fill="#F5F2EC">github.com/NIkhil-cmd-cmd/yc-hud-build</text>

  <text x="100" y="860" font-family="Georgia,'Instrument Serif',serif" font-size="40" fill="#F5F2EC" letter-spacing="-0.02em">The agent thought once.</text>
  <text x="100" y="920" font-family="Georgia,'Instrument Serif',serif" font-size="40" fill="#C4A484" letter-spacing="-0.02em">Now it never has to again.</text>

  <text x="1820" y="1000" text-anchor="end" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#5C6B5A">08 / 08</text>
  <line x1="100" y1="1020" x2="1820" y2="1020" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
