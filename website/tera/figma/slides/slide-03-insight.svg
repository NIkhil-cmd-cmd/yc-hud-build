<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#090909"/>

  <text x="100" y="100" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#C4A484" letter-spacing="0.14em" font-weight="600">INSIGHT</text>
  <text x="100" y="200" font-family="Georgia,'Instrument Serif',serif" font-size="68" fill="#F5F2EC" letter-spacing="-0.02em">
    <tspan x="100" dy="0">You already did the work.</tspan>
    <tspan x="100" dy="78">The browser should remember it.</tspan>
  </text>

  <rect x="100" y="360" width="820" height="520" rx="28" fill="#141414" stroke="#12A884" stroke-opacity="0.25"/>
  <text x="148" y="420" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#12A884" letter-spacing="0.12em" font-weight="600">WITH TERA</text>
  <text x="148" y="500" font-family="Georgia,serif" font-size="36" fill="#F5F2EC">Browse once</text>
  <text x="148" y="560" font-family="'DM Sans',system-ui,sans-serif" font-size="22" fill="#A3A39D">Clicks and navigation become states in a workflow graph.</text>
  <rect x="148" y="620" width="724" height="2" fill="#ffffff" fill-opacity="0.06"/>
  <text x="148" y="680" font-family="Georgia,serif" font-size="36" fill="#12A884">Replay many times</text>
  <text x="148" y="740" font-family="'DM Sans',system-ui,sans-serif" font-size="22" fill="#A3A39D">Policy lookup when the page matches. No LLM on repeat runs.</text>

  <rect x="1000" y="360" width="820" height="520" rx="28" fill="#141414" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="1048" y="420" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#7A7A74" letter-spacing="0.12em" font-weight="600">WITHOUT</text>
  <text x="1048" y="500" font-family="Georgia,serif" font-size="36" fill="#A3A39D">Re-reason every time</text>
  <text x="1048" y="560" font-family="'DM Sans',system-ui,sans-serif" font-size="22" fill="#7A7A74">The agent ignores that you already completed the task correctly.</text>
  <rect x="1048" y="620" width="724" height="2" fill="#ffffff" fill-opacity="0.06"/>
  <text x="1048" y="680" font-family="'DM Sans',system-ui,sans-serif" font-size="22" fill="#C4A484">Prompt, tokens, retry.</text>
  <text x="1048" y="740" font-family="'DM Sans',system-ui,sans-serif" font-size="22" fill="#7A7A74">Cost scales linearly with every repetition.</text>

  <text x="1820" y="1000" text-anchor="end" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#5C6B5A">03 / 08</text>
  <line x1="100" y1="1020" x2="1820" y2="1020" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
