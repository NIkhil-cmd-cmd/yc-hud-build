<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#090909"/>
  <radialGradient id="g" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#352822" stop-opacity="0.25"/><stop offset="100%" stop-color="#090909" stop-opacity="0"/></radialGradient>
  <rect width="1920" height="1080" fill="url(#g)"/>

  <text x="100" y="100" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#C4A484" letter-spacing="0.14em" font-weight="600">THE INSIGHT</text>
  <text x="100" y="200" font-family="Georgia,'Instrument Serif',serif" font-size="68" fill="#F5F2EC" letter-spacing="-0.02em">
    <tspan x="100" dy="0">You already know how.</tspan>
    <tspan x="100" dy="78">The browser should remember.</tspan>
  </text>
  <text x="100" y="400" font-family="'DM Sans',system-ui,sans-serif" font-size="24" fill="#A3A39D">Expert users don't re-derive a flight booking flow on every trip. They demonstrate once.</text>

  <!-- Left: human expert -->
  <rect x="100" y="480" width="820" height="420" rx="28" fill="#141414" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="148" y="540" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#7A7A74" letter-spacing="0.12em" font-weight="600">HUMAN EXPERT</text>
  <circle cx="200" cy="620" r="40" fill="#1c1c1a" stroke="#C4A484" stroke-width="1.5"/>
  <text x="200" y="628" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="22" fill="#C4A484">You</text>
  <path d="M260 620h120" stroke="#ffffff" stroke-opacity="0.15"/>
  <rect x="380" y="580" width="480" height="80" rx="12" fill="#1a1a18"/>
  <text x="400" y="615" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#A3A39D">Browse normally · click · type · navigate</text>
  <text x="400" y="642" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#F5F2EC">= implicit demonstration</text>
  <rect x="148" y="700" width="724" height="160" rx="16" fill="#0c1814" stroke="#12A884" stroke-opacity="0.35"/>
  <text x="180" y="750" font-family="Georgia,serif" font-size="28" fill="#12A884">Demonstration ’ Policy</text>
  <text x="180" y="790" font-family="'DM Sans',system-ui,sans-serif" font-size="18" fill="#A3A39D">Actions become states. States become a replayable Markov workflow.</text>
  <text x="180" y="830" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#7A7A74">No prompt engineering. No manual recording mode.</text>

  <!-- Right: agent re-reasoning -->
  <rect x="1000" y="480" width="820" height="420" rx="28" fill="#141414" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="1048" y="540" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#7A7A74" letter-spacing="0.12em" font-weight="600">TYPICAL AGENT</text>
  <rect x="1048" y="580" width="724" height="80" rx="12" fill="#241810" stroke="#C4A484" stroke-opacity="0.25"/>
  <text x="1068" y="615" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#C4A484">"Figure out how to book a flight from scratch"</text>
  <text x="1068" y="642" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#A3A39D">’ full LLM reasoning chain every run</text>
  <rect x="1048" y="700" width="724" height="160" rx="16" fill="#1a1a18"/>
  <text x="1080" y="750" font-family="Georgia,serif" font-size="28" fill="#A3A39D">Prompt ’ Tokens ’ Hope</text>
  <text x="1080" y="790" font-family="'DM Sans',system-ui,sans-serif" font-size="18" fill="#7A7A74">Ignores that the user already performed the task correctly once.</text>
  <text x="1080" y="830" font-family="'DM Sans',system-ui,sans-serif" font-size="16" fill="#7A7A74">Cost scales with every repetition.</text>

  <!-- Center bridge -->
  <rect x="900" y="640" width="120" height="120" rx="60" fill="#090909" stroke="#12A884" stroke-width="2"/>
  <text x="960" y="695" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#12A884">Tera</text>
  <text x="960" y="725" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#A3A39D">bridges</text>

  <text x="1820" y="1000" text-anchor="end" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#5C6B5A">03 / 08</text>
  <line x1="100" y1="1020" x2="1820" y2="1020" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
