<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#090909"/>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" stroke="#ffffff" stroke-opacity="0.025" fill="none"/></pattern>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect x="100" y="96" width="48" height="2" fill="#C4A484"/>

  <text x="100" y="400" font-family="Georgia,'Instrument Serif',serif" font-size="140" fill="#F5F2EC" letter-spacing="-0.03em">Tera</text>

  <text x="100" y="540" font-family="Georgia,'Instrument Serif',serif" font-size="64" fill="#F5F2EC" letter-spacing="-0.02em">
    <tspan x="100" dy="0">The agent thought once.</tspan>
    <tspan x="100" dy="76">Now it never has to again.</tspan>
  </text>

  <text x="100" y="720" font-family="'DM Sans',system-ui,sans-serif" font-size="28" fill="#A3A39D">Learn once from how you browse. Replay with zero LLM tokens.</text>

  <text x="1820" y="1000" text-anchor="end" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#5C6B5A">01 / 08</text>
  <line x1="100" y1="1020" x2="1820" y2="1020" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
