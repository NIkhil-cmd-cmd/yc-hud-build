<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#090909"/>

  <text x="100" y="100" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#12A884" letter-spacing="0.14em" font-weight="600">REPLAY</text>
  <text x="100" y="200" font-family="Georgia,'Instrument Serif',serif" font-size="68" fill="#F5F2EC" letter-spacing="-0.02em">Run 2 costs nothing.</text>
  <text x="100" y="280" font-family="'DM Sans',system-ui,sans-serif" font-size="24" fill="#A3A39D">State match triggers Tier-1 execution. Measured from API usage, not estimates.</text>

  <rect x="100" y="360" width="1720" height="480" rx="28" fill="#141414" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="160" y="440" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#7A7A74" font-weight="600">SYSTEM</text>
  <text x="560" y="440" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#7A7A74" font-weight="600">RUN 2 TOKENS</text>
  <text x="960" y="440" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#7A7A74" font-weight="600">RUN 2 TIME</text>
  <line x1="148" y1="460" x2="1772" y2="460" stroke="#ffffff" stroke-opacity="0.06"/>

  <rect x="148" y="490" width="1624" height="120" rx="16" fill="#1a1a18"/>
  <text x="180" y="560" font-family="'DM Sans',system-ui,sans-serif" font-size="24" fill="#A3A39D">Browser Use</text>
  <text x="560" y="560" font-family="Georgia,serif" font-size="44" fill="#C4A484">15k</text>
  <text x="960" y="560" font-family="Georgia,serif" font-size="44" fill="#C4A484">68s</text>

  <rect x="148" y="630" width="1624" height="140" rx="16" fill="#0c1814" stroke="#12A884" stroke-width="1.5" stroke-opacity="0.45"/>
  <text x="180" y="710" font-family="'DM Sans',system-ui,sans-serif" font-size="28" fill="#12A884" font-weight="600">Tera</text>
  <text x="560" y="710" font-family="Georgia,serif" font-size="56" fill="#12A884">0</text>
  <text x="960" y="710" font-family="Georgia,serif" font-size="56" fill="#F5F2EC">15s</text>

  <rect x="148" y="800" width="1624" height="64" rx="32" fill="#111110" stroke="#ffffff" stroke-opacity="0.05"/>
  <text x="180" y="840" font-family="'DM Sans',system-ui,sans-serif" font-size="17" fill="#A3A39D">Verified live in the tokens panel</text>
  <text x="560" y="840" font-family="'DM Sans',system-ui,sans-serif" font-size="17" fill="#12A884" font-weight="600">0 tokens</text>
  <text x="760" y="840" font-family="'DM Sans',system-ui,sans-serif" font-size="17" fill="#12A884" font-weight="600">T1 tier</text>

  <text x="1820" y="1000" text-anchor="end" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#5C6B5A">07 / 08</text>
  <line x1="100" y1="1020" x2="1820" y2="1020" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
