<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#090909"/>

  <text x="100" y="100" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#12A884" letter-spacing="0.14em" font-weight="600">OBSERVE</text>
  <text x="100" y="200" font-family="Georgia,'Instrument Serif',serif" font-size="68" fill="#F5F2EC" letter-spacing="-0.02em">Passive capture. No record button.</text>
  <text x="100" y="280" font-family="'DM Sans',system-ui,sans-serif" font-size="24" fill="#A3A39D">Every tab streams actions to the local engine while you browse.</text>

  <rect x="100" y="340" width="1040" height="560" rx="28" fill="#141414" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="100" y="340" width="1040" height="44" rx="28" fill="#1c1c1a"/>
  <circle cx="136" cy="362" r="6" fill="#5c5c58"/><circle cx="156" cy="362" r="6" fill="#5c5c58"/><circle cx="176" cy="362" r="6" fill="#5c5c58"/>
  <rect x="220" y="352" width="360" height="20" rx="10" fill="#090909"/>
  <text x="236" y="367" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#7A7A74">flights.google.com</text>

  <rect x="140" y="420" width="960" height="440" rx="12" fill="#111110"/>
  <rect x="180" y="480" width="300" height="44" rx="8" fill="#1a1a18" stroke="#12A884" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="200" y="508" font-family="'DM Sans',system-ui,sans-serif" font-size="14" fill="#12A884">click origin</text>
  <rect x="180" y="550" width="260" height="44" rx="8" fill="#1a1a18" stroke="#12A884" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="200" y="578" font-family="'DM Sans',system-ui,sans-serif" font-size="14" fill="#12A884">type destination</text>
  <rect x="180" y="620" width="320" height="44" rx="8" fill="#1a1a18" stroke="#12A884" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="200" y="648" font-family="'DM Sans',system-ui,sans-serif" font-size="14" fill="#12A884">click cheapest fare</text>

  <rect x="1180" y="340" width="640" height="560" rx="28" fill="#0c1814" stroke="#12A884" stroke-opacity="0.3"/>
  <text x="1228" y="400" font-family="'DM Sans',system-ui,sans-serif" font-size="11" fill="#12A884" letter-spacing="0.12em" font-weight="600">CAPTURED STEPS</text>
  <text x="1228" y="480" font-family="ui-monospace,monospace" font-size="16" fill="#A3A39D">1 navigate</text>
  <text x="1228" y="530" font-family="ui-monospace,monospace" font-size="16" fill="#A3A39D">2 click field</text>
  <text x="1228" y="580" font-family="ui-monospace,monospace" font-size="16" fill="#A3A39D">3 type text</text>
  <text x="1228" y="630" font-family="ui-monospace,monospace" font-size="16" fill="#A3A39D">4 click result</text>
  <rect x="1228" y="680" width="544" height="2" fill="#ffffff" fill-opacity="0.06"/>
  <text x="1228" y="740" font-family="'DM Sans',system-ui,sans-serif" font-size="20" fill="#F5F2EC">Each step gets an embedding</text>
  <text x="1228" y="780" font-family="'DM Sans',system-ui,sans-serif" font-size="18" fill="#7A7A74">Stored locally. Never uploaded.</text>

  <text x="1820" y="1000" text-anchor="end" font-family="'DM Sans',system-ui,sans-serif" font-size="13" fill="#5C6B5A">05 / 08</text>
  <line x1="100" y1="1020" x2="1820" y2="1020" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
